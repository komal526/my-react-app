<!doctype html>
<!-- LaunchBuilder v44 — index.html (fast first paint) -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1238" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LaunchBuilder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load in parallel and never block the page -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" /></noscript>
    <style>
      html,body{margin:0;background:#f4f5fa}
      .lb-boot{position:fixed;inset:0;display:flex;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      .lb-boot i{width:208px;background:linear-gradient(180deg,#0f1330,#11163a)}
      .lb-boot div{flex:1;display:grid;place-items:center;color:#475569;font-size:15px}
      .lb-boot b{display:inline-block;width:18px;height:18px;border:3px solid #f5b301;border-right-color:transparent;border-radius:50%;margin-right:10px;vertical-align:-4px;animation:lbspin .8s linear infinite}
      @keyframes lbspin{to{transform:rotate(360deg)}}
      @media (max-width:900px){.lb-boot i{display:none}}
    </style>
  </head>
  <body>
    <div id="root"><div class="lb-boot"><i></i><div><span><b></b>Loading LaunchBuilder…</span></div></div></div>
    <script>
      /* if the app can't start, show WHY instead of "Loading…" forever */
      (function () {
        function show(m) {
          var box = document.querySelector("#root .lb-boot div"); if (!box) return;
          box.innerHTML = '<div style="max-width:680px;padding:24px;text-align:left;font-size:14px;line-height:1.5"><strong style="display:block;color:#b91c1c;font-size:17px">LaunchBuilder could not start</strong>' +
            '<p>Press <strong>Ctrl+Shift+R</strong>. If this stays, send a screenshot of this box.</p><pre style="white-space:pre-wrap;font-size:12px;background:#fff;border:1px solid #e5e7eb;padding:12px;border-radius:10px;max-height:300px;overflow:auto">' +
            String(m || "").replace(/</g, "&lt;").slice(0, 3000) + '</pre><button style="padding:10px 16px;border-radius:10px;border:0;background:#0f1238;color:#f5b301;font-weight:700;cursor:pointer" onclick="location.reload()">Reload</button></div>';
        }
        window.__lbBootError = show;
        window.addEventListener("error", function (e) { if (e.target && e.target !== window && e.target.tagName !== "SCRIPT") return; show((e.error && e.error.stack) || e.message || ("Could not load " + ((e.target && (e.target.src || e.target.href)) || "a file"))); }, true);
        window.addEventListener("unhandledrejection", function (e) { var r = e.reason; show((r && (r.stack || r.message)) || r); });
        setTimeout(function () { show("Still loading after 25 seconds. The newest files may not have built on the server: run lb-deploy again and check its last lines for an error."); }, 25000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
